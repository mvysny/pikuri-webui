AllCops:
  TargetRubyVersion: 3.3
  # We don't track upstream cops as they land; opting in is a deliberate act.
  NewCops: disable
  SuggestExtensions: false
  # Merge, or this list *replaces* rubocop's own defaults, which include `vendor/**/*`, where
  # CI's BUNDLE_PATH puts the bundle.
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    # A scratchpad deleted at graduation (AGENTS.md).
    - "design/ideas/**/*"

# Size cops are noise by policy; a class is as long as its job.
Metrics:
  Enabled: false

# `class X < Data.define(...)` is how a value object gets a doc header and methods.
Style/DataInheritance:
  Enabled: false

# A column-aligned table of keyword arguments (`name:   name,`) is kept where it reads as one.
Layout/HashAlignment:
  EnforcedColonStyle: [key, table]
  EnforcedHashRocketStyle: [key, table]

# rubocop's defaults, plus `ui`, the name of the +[ui]+ config table.
Naming/MethodParameterName:
  AllowedNames: [at, by, db, id, in, io, ip, of, on, os, pp, to, ui]

# A spec's fixture constant inside `describe` is the suite's idiom; names are unique per file.
Lint/ConstantDefinitionInBlock:
  Exclude:
    - "spec/**/*"
