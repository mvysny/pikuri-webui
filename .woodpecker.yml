when:
  - event: [push, pull_request, manual]

variables:
  # --- the gem cache's S3 credentials, in one place ---
  # Hetzner Object Storage; the two secrets are repo secrets in Woodpecker.
  - &s3_env
    S3_ENDPOINT: https://hel1.your-objectstorage.com
    S3_BUCKET: mavi-ci-cache
    S3_ACCESS_KEY:
      from_secret: cache_access_key
    S3_SECRET_KEY:
      from_secret: cache_secret_key

  # --- why the cache is two steps of its own ---
  # Woodpecker resolves a step's secrets only *after* that step's `when`
  # matches (v3 compiler.go: `When.Match` then `createProcess`), so the cache
  # work lives in its own steps gated to the events the secrets allow. Inlined
  # into `test` it named a secret on every event, and a pull_request pipeline
  # died before running anything with "secret "cache_access_key" is not allowed
  # to be used with pipeline event "pull_request"". A PR — and a manual run,
  # whose permission here is unproven — simply builds uncached.
  - &cache_only
    - event: push

  # --- mc, the S3 client ---
  # Every dl.min.io path 410s since 2026-09-11, versioned archive URLs
  # included, so the binary comes from the GitHub release instead — pinned by
  # tag *and* by checksum, since this fetches 30 MB of executable into the
  # build. Bumping it means changing both lines.
  - &mc_setup |
      MC_RELEASE=RELEASE.2025-08-13T08-35-41Z
      MC_SHA256=01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891
      curl -fsSL "https://github.com/minio/mc/releases/download/$MC_RELEASE/mc.linux-amd64.$MC_RELEASE" -o /usr/local/bin/mc
      echo "$MC_SHA256  /usr/local/bin/mc" | sha256sum -c -
      chmod +x /usr/local/bin/mc
      mc alias set hz "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"

steps:
  - name: restore-cache
    image: ruby:3.3
    when: *cache_only
    environment: *s3_env
    commands:
      - *mc_setup

      # Keyed on Gemfile.lock so it auto-busts when deps change. The key is
      # handed to save-cache through a file rather than recomputed there,
      # because `bundle install` may rewrite Gemfile.lock — a key computed
      # afterwards would store the cache where no later restore looks.
      - |
        OBJ="hz/$S3_BUCKET/$CI_REPO_NAME/bundle-$(sha256sum Gemfile.lock | cut -c1-16).tgz"
        mc cp "$OBJ" bundle.tgz 2>/dev/null && tar xzf bundle.tgz && echo "cache hit" || echo "cache miss"
        mkdir -p vendor/bundle && echo "$OBJ" > vendor/bundle/.cache-key

  - name: test
    image: ruby:3.3
    environment:
      BUNDLE_PATH: vendor/bundle
    commands:
      - ruby -v

      # --- the sibling checkout the Gemfile points at ---
      # pikuri-core / pikuri-pdf are path dependencies on ../pikuri (this
      # shell tracks pikuri master again, not a release), and CI checks out
      # only this repo — without the clone, bundle install fails outright.
      # Depth 1 of master: the same tip a developer's sibling checkout has.
      # Retried because a Codeberg 504 here has reddened an otherwise green
      # build; the final `test` is what turns three dead attempts into a
      # failure.
      - |
        for attempt in 1 2 3; do
          git clone --depth 1 https://codeberg.org/mvysny/pikuri.git ../pikuri && break
          echo "clone attempt $attempt failed - retrying in 10s"
          rm -rf ../pikuri
          sleep 10
        done
        test -d ../pikuri/.git

      # --- install + check ---
      # `rake check` is the cross-repo standard full-verification command —
      # the same one a contributor runs locally, so CI cannot drift from it.
      - bundle install --jobs 4 --retry 3
      - bundle exec rake check

  - name: save-cache
    image: ruby:3.3
    when: *cache_only
    environment: *s3_env
    commands:
      - *mc_setup

      # bundle.tgz exists only on a hit, so its absence is the miss. Skipped
      # outright when `test` failed — Woodpecker does not run a later step
      # after a failed one — so a broken build never poisons the cache.
      - |
        if [ ! -f bundle.tgz ]; then
          tar czf bundle.tgz vendor/bundle
          mc cp bundle.tgz "$(cat vendor/bundle/.cache-key)"
        fi
